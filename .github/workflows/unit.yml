name: Unit Tests
on:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-unit
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run ts checks, linting, and unit tests
        run: npm run test:ci
      - name: Publish Test Summary Results
        if: ${{ always() }}
        run: |
          # pr-comment.yml always posts pr-comment.html, so write a fallback
          # before failing when no report can be generated.
          fail() {
            echo "$1"
            mkdir -p pr-comment
            echo "<h3>Unit Test Summary</h3><p>$1. See the workflow run for details.</p>" > pr-comment/pr-comment.html
            exit 1
          }

          if [ ! -f test-reports/vitest.junit.xml ]; then
            fail "No JUnit report found"
          fi

          npm run report:junit2ctrf

          # The junit-to-ctrf npm package exits with a 0 status code even if
          # it fails to parse the JUnit report, so check for the CTRF file manually
          # and explicitly exit with a non-zero status code if it's not found.
          if [ ! -f test-reports/ctrf-report.json ]; then
            fail "CTRF report not created - junit-to-ctrf may have failed to parse JUnit report"
          fi

          npm run report:ctrfsummary
          sed -i 's/<h3>Test Summary<\/h3>/<h3>Unit Test Summary<\/h3>/' $GITHUB_STEP_SUMMARY
          npm run report:prcomment
      - name: Save PR Number
        if: ${{ always() }}
        run: echo ${{ github.event.number }} > pr-comment/PR-number.txt
      - name: Upload Summary as Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-unit
          path: pr-comment/
          retention-days: 1
